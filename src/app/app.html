<div class="min-h-dvh bg-stone-50 text-stone-900">
  <header class="sticky top-0 z-40 border-b border-stone-200/80 bg-white/80 pt-[env(safe-area-inset-top)] backdrop-blur">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6">
      <a routerLink="/produtos" class="flex items-center gap-2.5">
        <span class="flex size-9 items-center justify-center rounded-xl bg-amber-500 text-lg font-bold text-white">R$</span>
        <span class="text-lg font-bold tracking-tight">Calculadora de Preço</span>
      </a>
      <nav class="flex items-center gap-1 text-sm font-medium">
        <a
          routerLink="/produtos"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-stone-100 text-stone-900"
          class="rounded-lg px-3 py-2 text-stone-500 transition hover:text-stone-900"
        >Produtos</a>
        <a
          routerLink="/produtos/novo"
          routerLinkActive="bg-stone-100 text-stone-900"
          class="hidden rounded-lg px-3 py-2 text-stone-500 transition hover:text-stone-900 sm:block"
        >Novo produto</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8 pb-[calc(2rem+env(safe-area-inset-bottom))] sm:px-6 sm:py-10">
    @if (erroBanco()) {
      <div class="mb-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ erroBanco() }}</div>
    }
    <router-outlet />
  </main>
</div>
